name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,httpx,playwright]"
          python -c "import instat; print('instat OK', instat.__file__)"
      - name: Ruff
        run: ruff check instat tests
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mínimo aprovado: 3.12. 3.13 entra na matriz para gerar evidência em Linux
        # (local: 637 testes passaram em 3.13.15/Windows, sem o extra stealth); só vai
        # para os classificadores depois de passar aqui. 3.14 ainda não avaliado.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # extras opcionais instalados para que os testes que dependem deles executem de fato
          pip install -e ".[dev,httpx,playwright]"
          python -c "import instat; print('instat OK', instat.__file__)"
      - name: Pytest
        run: pytest tests -m "not e2e and not mobile and not real" --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build
        run: python -m build
      - name: Smoke test do wheel instalado fora do checkout
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/python -c "import instat, instat.mobile.engines; print('wheel OK', instat.__file__)"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
